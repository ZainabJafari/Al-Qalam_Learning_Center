<div class="donation-options" [attr.aria-label]="'donationForm.frequencyLabel' | t">
  <button
    class="option-button"
    [class.is-selected]="selectedFrequency === 'OneTime'"
    type="button"
    (click)="selectFrequency('OneTime')"
  >
    {{ 'donationForm.oneTime' | t }}
  </button>
  <button
    class="option-button"
    [class.is-selected]="selectedFrequency === 'Monthly'"
    type="button"
    (click)="selectFrequency('Monthly')"
  >
    {{ 'donationForm.monthly' | t }}
  </button>
  <button
    class="option-button"
    [class.is-selected]="selectedFrequency === 'Yearly'"
    type="button"
    (click)="selectFrequency('Yearly')"
  >
    {{ 'donationForm.yearly' | t }}
  </button>
</div>

<div class="donation-options amount-options" [attr.aria-label]="'donationForm.amountLabel' | t">
  <button
    class="option-button"
    [class.is-selected]="!isCustomAmountSelected && selectedAmountMinor === 2500"
    type="button"
    (click)="selectAmount(2500)"
  >
    $25
  </button>
  <button
    class="option-button"
    [class.is-selected]="!isCustomAmountSelected && selectedAmountMinor === 5500"
    type="button"
    (click)="selectAmount(5500)"
  >
    $55
  </button>
  <button
    class="option-button"
    [class.is-selected]="!isCustomAmountSelected && selectedAmountMinor === 10000"
    type="button"
    (click)="selectAmount(10000)"
  >
    $100
  </button>
  <button
    class="option-button"
    [class.is-selected]="isCustomAmountSelected"
    type="button"
    (click)="selectCustomAmount()"
  >
    {{ 'donationForm.customAmount' | t }}
  </button>
</div>

<div class="custom-amount-panel" [hidden]="!isCustomAmountSelected">
  <label>
    {{ 'donationForm.customAmountInput' | t }}
    <span class="custom-amount-input">
      <span aria-hidden="true">$</span>
      <input
        name="customAmount"
        type="number"
        min="1"
        step="1"
        inputmode="decimal"
        [(ngModel)]="customAmountDollars"
        (ngModelChange)="setCustomAmount($event)"
        placeholder="50"
      />
    </span>
  </label>
  <p>{{ 'donationForm.customAmountHint' | t }}</p>
</div>

<div class="donor-fields">
  <label>
    {{ 'donationForm.name' | t }}
    <input
      name="donorName"
      type="text"
      autocomplete="name"
      [(ngModel)]="donorName"
      [placeholder]="'donationForm.namePlaceholder' | t"
    />
  </label>

  <label>
    {{ 'donationForm.email' | t }}
    <input
      name="donorEmail"
      type="email"
      autocomplete="email"
      [(ngModel)]="donorEmail"
      [placeholder]="'donationForm.emailPlaceholder' | t"
    />
  </label>

  <label class="full-width">
    {{ 'donationForm.message' | t }}
    <textarea
      name="donorMessage"
      rows="3"
      [(ngModel)]="donorMessage"
      [placeholder]="'donationForm.messagePlaceholder' | t"
    ></textarea>
  </label>
</div>

<div class="donation-summary" [attr.aria-label]="'donationForm.summaryLabel' | t">
  <span>{{ 'donationForm.summary' | t }}</span>
  <strong>{{ selectedAmountLabel }} {{ selectedFrequencyLabel }}</strong>
  <p [hidden]="!trimmedDonorEmail">
    {{ 'donationForm.receiptEmail' | t }}: {{ trimmedDonorEmail }}
  </p>
</div>

<button
  class="donate-button"
  type="button"
  [disabled]="isDonationLoading"
  (click)="startDonation()"
>
  {{ isDonationLoading ? ('donationForm.startingCheckout' | t) : (('donationForm.donateButton' | t) + ' ' + selectedAmountLabel) }}
</button>

<p class="error-message" [hidden]="!donationErrorKey">
  {{ donationErrorKey | t }}
</p>
