<header class="site-navbar">
  <a routerLink="/" class="brand" [attr.aria-label]="'common.brandHomeLabel' | t">
    <img src="/images/AlqalamLogo.png" [alt]="'common.brandAlt' | t" class="brand-logo" />
  </a>

  <nav class="nav-links" [attr.aria-label]="'nav.mainLabel' | t">
    <a routerLink="/about">{{ 'nav.about' | t }}</a>
    <a routerLink="/courses">{{ 'nav.courses' | t }}</a>
    <a routerLink="/" fragment="story">{{ 'nav.story' | t }}</a>
    <a routerLink="/contact">{{ 'nav.contact' | t }}</a>
  </nav>

  <button
    class="language-toggle"
    type="button"
    [attr.aria-label]="'nav.languageToggleLabel' | t"
    (click)="toggleLanguage()"
  >
    {{ 'nav.languageLabel' | t }}
  </button>

  <a routerLink="/donate" class="nav-cta">{{ 'nav.donate' | t }}</a>
</header>
