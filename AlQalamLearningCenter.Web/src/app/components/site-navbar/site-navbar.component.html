<header class="site-navbar">
  <a routerLink="/" class="brand" [attr.aria-label]="'common.brandHomeLabel' | t">
    <img src="/images/AlqalamLogo.png" [alt]="'common.brandAlt' | t" class="brand-logo" />
  </a>

  <nav class="nav-links" [attr.aria-label]="'nav.mainLabel' | t">
    <a
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      {{ 'nav.home' | t }}
    </a>
    <a
      routerLink="/about"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      {{ 'nav.about' | t }}
    </a>
    <a
      routerLink="/courses"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      {{ 'nav.courses' | t }}
    </a>
    <a
      routerLink="/contact"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      {{ 'nav.contact' | t }}
    </a>
  </nav>

  <button
    class="language-toggle"
    type="button"
    [attr.aria-label]="'nav.languageToggleLabel' | t"
    (click)="toggleLanguage()"
  >
    <svg class="nav-button-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18" />
      <path d="M12 3c2.2 2.4 3.3 5.4 3.3 9s-1.1 6.6-3.3 9" />
      <path d="M12 3c-2.2 2.4-3.3 5.4-3.3 9s1.1 6.6 3.3 9" />
    </svg>
    {{ 'nav.languageLabel' | t }}
  </button>

  <a
    routerLink="/donate"
    class="nav-cta"
    routerLinkActive="is-active"
    [routerLinkActiveOptions]="{ exact: true }"
    ariaCurrentWhenActive="page"
  >
    <svg class="nav-button-icon donate-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.3 5.7c-1.7-1.8-4.5-1.9-6.3-.2l-2 1.9-2-1.9c-1.8-1.7-4.6-1.6-6.3.2-1.8 1.9-1.7 4.8.2 6.6L12 20l8.1-7.7c1.9-1.8 2-4.7.2-6.6Z" />
    </svg>
    {{ 'nav.donate' | t }}
  </a>
</header>
