<app-site-navbar />

<main class="donate-shell">
  <section class="donate-hero">
    <div class="donate-copy">
      <p class="eyebrow">{{ 'donate.eyebrow' | t }}</p>
      <h1>{{ 'donate.title' | t }}</h1>
      <p>
        {{ 'donate.text' | t }}
      </p>
    </div>

    <aside class="donation-card" [attr.aria-label]="'donate.formLabel' | t">
      <div class="donation-card-header">
        <span>{{ 'donate.secureDonation' | t }}</span>
        sss
        <h2>{{ 'donate.chooseSupport' | t }}</h2>
        <p>{{ 'donate.stripeText' | t }}</p>
      </div>

      <app-donation-form />
    </aside>
  </section>
</main>
